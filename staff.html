<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ВОСТОК ХАУС • Кабинет персонала — Кухня KDS, Касса POS, Меню и Склад</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* ИИ АССИСТЕНТ ПЕРСОНАЛА */
    .ai-fab {
      position: fixed; right: 1.25rem; bottom: 1.25rem; z-index: 45;
      display: inline-flex; align-items: center; gap: .6rem;
      padding: .85rem 1.25rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.3);
      background: linear-gradient(135deg, #1c1917, #f97316); color: #fff;
      font-weight: 800; font-size: .88rem; cursor: pointer;
      box-shadow: 0 14px 35px -10px rgba(28, 25, 23, .85);
      transition: transform .15s, filter .15s;
    }
    .ai-fab:hover { transform: translateY(-2px); filter: brightness(1.08); }
    .ai-panel {
      position: fixed; right: 1.25rem; bottom: 5.25rem; z-index: 45;
      width: min(415px, calc(100vw - 2rem)); height: min(560px, calc(100vh - 7.5rem));
      display: flex; flex-direction: column; border-radius: 1.5rem; overflow: hidden;
      background: rgba(255, 255, 255, .98); border: 1px solid #d6d3d1;
      -webkit-backdrop-filter: blur(22px) saturate(150%); backdrop-filter: blur(22px) saturate(150%);
      box-shadow: 0 28px 70px -20px rgba(0, 0, 0, .55);
    }
    .ai-panel.hidden { display: none; }
    .ai-msg {
      max-width: 88%; padding: .7rem .95rem; border-radius: 1rem;
      font-size: .83rem; line-height: 1.45; word-wrap: break-word;
    }
    .ai-msg-user {
      align-self: flex-end; color: #fff;
      background: linear-gradient(135deg, #f97316, #ea580c);
      border-bottom-right-radius: .3rem;
    }
    .ai-msg-bot {
      align-self: flex-start; color: #1c1917;
      background: #f5f5f4; border: 1px solid #e7e5e4;
      border-bottom-left-radius: .3rem;
    }
    .ai-chip {
      font-size: .73rem; font-weight: 600; padding: .35rem .75rem; border-radius: 999px;
      background: #f5f5f4; border: 1px solid #d6d3d1; color: #292524;
      cursor: pointer; white-space: nowrap; transition: all .15s;
    }
    .ai-chip:hover { background: #ffedd5; border-color: #f97316; color: #c2410c; }
    .ai-dots span {
      display: inline-block; width: 6px; height: 6px; border-radius: 50%;
      background: #f97316; margin-right: 4px;
      animation: aiBounce 1.2s infinite ease-in-out;
    }
    .ai-dots span:nth-child(2) { animation-delay: .18s; }
    .ai-dots span:nth-child(3) { animation-delay: .36s; }
    @keyframes aiBounce { 0%, 80%, 100% { transform: scale(.6); opacity: .4; } 40% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body class="bg-stone-100 text-stone-900 antialiased">
  <div id="app"></div>

  <!-- ИИ АССИСТЕНТ ПЕРСОНАЛА (Восток AI • Аналитик) -->
  <button id="aiFab" class="ai-fab" type="button" aria-label="Открыть Восток AI Аналитик">
    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/>
      <path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15z"/>
    </svg>
    <span>Восток AI • ERP</span>
  </button>

  <section id="aiPanel" class="ai-panel hidden" aria-label="Восток AI Аналитик персонала">
    <div class="flex items-center justify-between px-4 py-3 border-b border-stone-800 bg-stone-900 text-white">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-orange-500 grid place-items-center text-white font-black text-xs">AI</div>
        <div>
          <div class="font-extrabold text-sm leading-tight">Восток AI • Аналитик смены</div>
          <div class="text-[11px] text-stone-400">Живая сводка по БД: выручка ₸, KDS и склад</div>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <button id="aiClear" type="button" class="px-2.5 py-1 rounded-lg bg-stone-800 hover:bg-stone-700 text-[11px] font-semibold text-stone-300">Очистить</button>
        <button id="aiClose" type="button" class="w-7 h-7 rounded-lg bg-stone-800 hover:bg-stone-700 text-xs font-bold">✕</button>
      </div>
    </div>

    <div id="aiMessages" class="flex-1 overflow-y-auto p-4 flex flex-col gap-3">
      <div class="ai-msg ai-msg-bot">
        Здравствуйте! Я <b>Восток AI • Аналитик</b> для сотрудников ресторана <b>«ВОСТОК ХАУС»</b>.<br><br>
        Я анализирую живые данные из вашей базы Supabase: выручку в <b>₸</b>, очередь заказов на кухне KDS, стоп-лист и критические остатки на складе.
      </div>
    </div>

    <div class="px-3 py-2 border-t border-stone-200 flex gap-1.5 overflow-x-auto no-scrollbar bg-stone-50">
      <button type="button" class="ai-chip ai-quick" data-prompt="Дай полную оперативную сводку по выручке смены в тенге, активным заказам и стоп-листу.">📊 Сводка смены (₸)</button>
      <button type="button" class="ai-chip ai-quick" data-prompt="Проверь остатки на складе из базы данных: какие продукты заканчиваются?">📦 Остатки склада</button>
      <button type="button" class="ai-chip ai-quick" data-prompt="Сколько заказов сейчас на кухне и в доставке?">👨‍🍳 Очередь кухни</button>
    </div>

    <form id="aiForm" class="p-3 border-t border-stone-200 flex items-center gap-2 bg-white">
      <input id="aiInput" type="text" class="flex-1 px-3.5 py-2 rounded-xl border border-stone-200 text-xs focus:outline-none focus:ring-2 focus:ring-orange-500" placeholder="Спросите про выручку, склад, заказы..." autocomplete="off" required />
      <button id="aiSendBtn" type="submit" class="px-4 py-2 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold shrink-0">Отправить</button>
    </form>
  </section>

  <script src="images.js"></script>
  <script src="shared-data.js"></script>
  <script>
    const IMAGES = window.VOSTOK_IMAGES || {};
    const CATEGORIES = window.VOSTOK_CATEGORIES.filter((c) => c.slug !== "all");
    const STATUS_META = window.VOSTOK_STATUS_META;
    const ROLE_META = window.VOSTOK_ROLE_META;
    const STAFF_ROLES = Object.fromEntries(Object.entries(ROLE_META).filter(([, m]) => m.staff));
    const fmt = window.fmtKZT;

    const initialCfg = window.loadVostokConfig();
    const initialDb = window.loadSharedDb();

    let savedStaffUser = null;
    try {
      const raw = localStorage.getItem("vostok_staff_user_v2");
      if (raw) savedStaffUser = JSON.parse(raw);
    } catch (_) {}

    const state = {
      user: savedStaffUser || {
        id: "u-1",
        name: "Рустам Каримов",
        email: "admin@vostok.kz",
        role: "admin",
        shift: true
      },
      authOpen: false,
      authMode: "register",
      authRole: "admin",
      staffTab: "analytics", // analytics | kds | pos | courier | menu | inventory | staff | supabase
      toast: "",
      // POS-касса
      posCart: [],
      posCustomer: "Гость в зале",
      posPhone: "+7 (701) 000-00-00",
      posType: "dine_in", // 'dine_in' | 'delivery'
      posAddress: "",
      posCashGiven: "",
      // Форма нового блюда с загрузкой фото в Supabase Storage
      newDishName: "",
      newDishCat: "plov",
      newDishPrice: "2690",
      newDishWeight: "380",
      newDishCalories: "640",
      newDishDesc: "",
      newDishHit: true,
      newDishSpicy: false,
      newDishVeg: false,
      newDishImageFile: null,
      newDishImagePreview: "",
      newDishUploading: false,
      // База данных и конфигурация Supabase
      sbUrl: initialCfg.url,
      sbKey: initialCfg.key,
      aiFn: initialCfg.aiFn,
      products: initialDb.products,
      inventory: initialDb.inventory,
      staff: initialDb.staff,
      orders: initialDb.orders,
      paymentLogs: initialDb.paymentLogs
    };

    let sbClient = null;
    let sbChannel = null;
    let aiHistory = [];

    function getSbClient() {
      if (!state.sbUrl || !state.sbKey || !window.supabase) return null;
      if (sbClient) return sbClient;
      try {
        sbClient = window.supabase.createClient(state.sbUrl, state.sbKey);
        return sbClient;
      } catch (_) {
        return null;
      }
    }

    function persistLocal() {
      window.saveSharedDb({
        products: state.products,
        inventory: state.inventory,
        staff: state.staff,
        orders: state.orders,
        paymentLogs: state.paymentLogs
      });
      try {
        if (state.user) localStorage.setItem("vostok_staff_user_v2", JSON.stringify(state.user));
      } catch (_) {}
    }

    window.addEventListener("storage", (e) => {
      if (e.key === "vostok_house_shared_db_v2") {
        const fresh = window.loadSharedDb();
        state.products = fresh.products;
        state.inventory = fresh.inventory;
        state.staff = fresh.staff;
        state.orders = fresh.orders;
        state.paymentLogs = fresh.paymentLogs;
        render();
      }
    });

    async function syncFromSupabase() {
      const sb = getSbClient();
      if (!sb) return;
      try {
        const [prodRes, invRes, ordRes, profRes, payRes] = await Promise.all([
          sb.from("products").select("*").order("created_at", { ascending: true }),
          sb.from("inventory").select("*").order("name", { ascending: true }),
          sb.from("orders").select("*").order("created_at", { ascending: false }).limit(50),
          sb.from("vostok_profiles").select("*").neq("role", "customer"),
          sb.from("payment_logs").select("*").order("created_at", { ascending: false }).limit(30)
        ]);

        if (prodRes.data && prodRes.data.length > 0) {
          const cloudProds = prodRes.data.map((p, idx) => ({
            id: p.id,
            category_slug: p.category_slug || "plov",
            name: p.name,
            description: p.description || "",
            base_price: Number(p.base_price) || 2500,
            weight: Number(p.weight_grams || p.weight || 350),
            calories: Number(p.calories || 550),
            image: p.image_url || p.image || window.VOSTOK_SEED_PRODUCTS[idx % window.VOSTOK_SEED_PRODUCTS.length].image,
            is_available: p.is_available !== false,
            is_hit: Boolean(p.is_hit),
            is_spicy: Boolean(p.is_spicy),
            is_veg: Boolean(p.is_veg),
            sizes: Array.isArray(p.sizes) && p.sizes.length ? p.sizes : [{ label: "Стандарт", mult: 1, g: Number(p.weight_grams || 350) }]
          }));
          const cloudIds = new Set(cloudProds.map((x) => x.id));
          state.products = [
            ...cloudProds,
            ...state.products.filter((localP) => !cloudIds.has(localP.id))
          ];
        }

        if (invRes.data && invRes.data.length > 0) {
          state.inventory = invRes.data.map((i) => ({
            id: i.id,
            name: i.name,
            unit: i.unit || "кг",
            qty: Number(i.quantity ?? i.qty ?? 0),
            min: Number(i.min_threshold ?? i.min ?? 5)
          }));
        }

        if (ordRes.data && ordRes.data.length > 0) {
          state.orders = ordRes.data.map((o) => ({
            id: String(o.id),
            number: Number(o.order_number || 101),
            customer: o.customer_name || "Гость",
            phone: o.customer_phone || "",
            type: o.delivery_type === "pickup" ? "dine_in" : (o.delivery_type || "delivery"),
            address: o.address || "В зале (свободная посадка)",
            comment: o.comment || "",
            paymentMethod: o.payment_method || "card",
            paymentStatus: o.payment_status || "paid",
            transactionId: o.transaction_id || "",
            status: o.status || "new",
            total: Number(o.total_amount || 0),
            createdAt: o.created_at ? new Date(o.created_at).getTime() : Date.now(),
            items: Array.isArray(o.items) ? o.items : []
          }));
        }

        if (profRes.data && profRes.data.length > 0) {
          state.staff = profRes.data.map((m) => ({
            id: m.id,
            name: m.full_name || m.email || "Сотрудник",
            email: m.email || "",
            role: STAFF_ROLES[m.role] ? m.role : "kitchen",
            shift: Boolean(m.is_on_shift)
          }));
        }

        if (payRes.data && payRes.data.length > 0) {
          state.paymentLogs = payRes.data;
        }

        persistLocal();
        render();

        if (!sbChannel) {
          sbChannel = sb
            .channel("vostok-staff-live")
            .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => syncFromSupabase())
            .on("postgres_changes", { event: "*", schema: "public", table: "products" }, () => syncFromSupabase())
            .on("postgres_changes", { event: "*", schema: "public", table: "inventory" }, () => syncFromSupabase())
            .on("postgres_changes", { event: "*", schema: "public", table: "payment_logs" }, () => syncFromSupabase())
            .subscribe();
        }
      } catch (err) {
        console.warn("Supabase staff sync fallback:", err);
      }
    }

    function notify(msg) {
      state.toast = msg;
      render();
      setTimeout(() => {
        if (state.toast === msg) {
          state.toast = "";
          render();
        }
      }, 3200);
    }

    // Конвертация файла в DataURL (для мгновенного превью и резервного сохранения)
    function fileToDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Загрузка фото блюда в Supabase Storage (bucket: menu-images)
    async function uploadImageToSupabaseStorage(file) {
      const sb = getSbClient();
      const fallbackDataUrl = await fileToDataUrl(file);
      if (!sb) return { url: fallbackDataUrl, storageUsed: false };

      try {
        const ext = (file.name.split(".").pop() || "jpg").toLowerCase().replace(/[^a-z0-9]/g, "");
        const filePath = `dishes/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext || "jpg"}`;
        const { error: upErr } = await sb.storage
          .from("menu-images")
          .upload(filePath, file, { cacheControl: "3600", upsert: true, contentType: file.type || "image/jpeg" });

        if (upErr) {
          console.warn("Supabase Storage upload fallback to DataURL:", upErr.message);
          return { url: fallbackDataUrl, storageUsed: false };
        }

        const { data: pubData } = sb.storage.from("menu-images").getPublicUrl(filePath);
        if (pubData?.publicUrl) {
          return { url: pubData.publicUrl, storageUsed: true };
        }
      } catch (err) {
        console.warn("Storage upload error:", err);
      }
      return { url: fallbackDataUrl, storageUsed: false };
    }

    function render() {
      const root = document.getElementById("app");
      root.innerHTML = renderStaffView() + renderAuthModal() + renderToast();
      bindStaffEvents();
    }

    function renderToast() {
      if (!state.toast) return "";
      return `<div class="fixed bottom-20 right-5 z-50 bg-stone-900 text-white px-4 py-3 rounded-2xl shadow-xl text-sm font-semibold border border-stone-700">${state.toast}</div>`;
    }

    function renderStaffView() {
      const revenue = state.orders.filter((o) => o.status !== "cancelled").reduce((s, o) => s + Number(o.total || 0), 0);
      const avgCheck = state.orders.length ? Math.round(revenue / state.orders.length) : 0;
      const kds = state.orders.filter((o) => ["new", "cooking", "ready"].includes(o.status));
      const courierQ = state.orders.filter((o) => o.type === "delivery" && ["ready", "delivering"].includes(o.status));
      const lowInvCount = state.inventory.filter((i) => Number(i.qty) <= Number(i.min)).length;
      const stoppedCount = state.products.filter((p) => !p.is_available).length;

      const tabs = [
        { id: "analytics", label: "📊 Аналитика" },
        { id: "kds",       label: `👨‍🍳 Кухня (KDS) • ${kds.length}` },
        { id: "pos",       label: "💳 Касса (POS)" },
        { id: "courier",   label: `🚚 Курьер • ${courierQ.length}` },
        { id: "menu",      label: `🍛 Меню и Фото (${state.products.length})` },
        { id: "inventory", label: `📦 Склад ${lowInvCount ? `(${lowInvCount}!)` : ""}` },
        { id: "staff",     label: "👥 Персонал и роли" },
        { id: "supabase",  label: "☁️ Supabase" }
      ];

      return `
        <header class="bg-stone-900 text-white sticky top-0 z-30 shadow-md">
          <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-2xl bg-orange-500 text-white flex items-center justify-center font-black text-lg shadow">В</div>
              <div>
                <div class="flex items-center gap-2">
                  <span class="font-extrabold text-sm sm:text-base">ВОСТОК ХАУС • ПЕРСОНАЛ</span>
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-orange-500/20 text-orange-300">
                    ${ROLE_META[state.user?.role || "admin"]?.label}
                  </span>
                </div>
                <div class="text-[11px] text-stone-400">
                  ${state.user?.name || "Сотрудник"} • ${state.sbUrl ? "Supabase Live подключён" : "Локальный режим"}
                </div>
              </div>
            </div>

            <div class="flex items-center gap-2">
              <a href="index.html" class="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-xs font-semibold text-stone-200">
                ↗ Витрина клиентов
              </a>
              <button id="open-staff-auth-btn" class="px-3.5 py-1.5 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-xs font-bold">
                👤 Регистрация / Роль
              </button>
            </div>
          </div>

          <div class="border-t border-stone-800 bg-stone-900/95">
            <div class="max-w-7xl mx-auto px-4 flex gap-1 overflow-x-auto no-scrollbar py-2">
              ${tabs.map((t) => `
                <button data-stab="${t.id}" class="stab-btn px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${state.staffTab === t.id ? "bg-orange-500 text-white shadow" : "text-stone-300 hover:bg-stone-800"}">${t.label}</button>
              `).join("")}
            </div>
          </div>
        </header>

        <main class="max-w-7xl mx-auto px-4 py-6 pb-24">
          <!-- 1. АНАЛИТИКА И ЖУРНАЛ ОПЛАТ -->
          ${state.staffTab === "analytics" ? `
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
              <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-200/70">
                <div class="text-xs text-stone-500 font-semibold">Выручка смены</div>
                <div class="text-2xl font-extrabold mt-1 text-emerald-600">${fmt(revenue)}</div>
                <div class="text-[11px] text-stone-400 mt-1">Средний чек: ${fmt(avgCheck)}</div>
              </div>
              <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-200/70">
                <div class="text-xs text-stone-500 font-semibold">Всего заказов</div>
                <div class="text-2xl font-extrabold mt-1">${state.orders.length}</div>
                <div class="text-[11px] text-stone-400 mt-1">Доставка и В зале</div>
              </div>
              <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-200/70">
                <div class="text-xs text-stone-500 font-semibold">Очередь кухни (KDS)</div>
                <div class="text-2xl font-extrabold mt-1 text-orange-600">${kds.length}</div>
                <div class="text-[11px] text-stone-400 mt-1">Норматив SLA: до 20 мин</div>
              </div>
              <div class="bg-white rounded-2xl p-5 shadow-sm border border-stone-200/70">
                <div class="text-xs text-stone-500 font-semibold">На стопе / Крит. склад</div>
                <div class="text-2xl font-extrabold mt-1">${stoppedCount} / <span class="${lowInvCount ? "text-rose-600" : ""}">${lowInvCount}</span></div>
                <div class="text-[11px] text-stone-400 mt-1">Блюд в меню: ${state.products.length}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
              <div class="lg:col-span-2 bg-white rounded-2xl p-5 shadow-sm border border-stone-200/70 overflow-x-auto">
                <h3 class="font-extrabold text-base mb-3">Все заказы ресторана</h3>
                <table class="w-full text-sm text-left">
                  <thead class="text-xs text-stone-500 border-b">
                    <tr>
                      <th class="pb-2">№</th>
                      <th class="pb-2">Гость</th>
                      <th class="pb-2">Формат</th>
                      <th class="pb-2">Статус</th>
                      <th class="pb-2 text-right">Сумма (₸)</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y">
                    ${state.orders.map((o) => `
                      <tr>
                        <td class="py-2.5 font-extrabold">#${o.number}</td>
                        <td class="py-2.5">
                          <div class="font-semibold text-xs">${o.customer}</div>
                          <div class="text-[11px] text-stone-400">${o.phone}</div>
                        </td>
                        <td class="py-2.5 text-xs">
                          ${o.type === "delivery" ? "🚚 Доставка" : "🍽️ В зале"}
                        </td>

    function bindStaffEvents() {
      document.querySelectorAll(".stab-btn").forEach((b) => (b.onclick = () => { state.staffTab = b.dataset.stab; render(); }));

      const openAuth = document.getElementById("open-staff-auth-btn");
      if (openAuth) openAuth.onclick = () => { state.authOpen = true; render(); };
      const addStaffBtn = document.getElementById("add-staff-btn");
      if (addStaffBtn) addStaffBtn.onclick = () => { state.authOpen = true; render(); };
      const closeAuth = document.getElementById("close-staff-auth-btn");
      if (closeAuth) closeAuth.onclick = () => { state.authOpen = false; render(); };

      document.querySelectorAll(".role-pick-btn").forEach((b) => (b.onclick = () => { state.authRole = b.dataset.role; render(); }));
      document.querySelectorAll(".quick-role-btn").forEach((b) => {
        b.onclick = () => {
          const r = b.dataset.qrole;
          const preset = state.staff.find((s) => s.role === r);
          state.user = preset || { id: `u-${Date.now()}`, name: `Сотрудник (${ROLE_META[r].label})`, role: r, email: `${r}@vostok.kz`, shift: true };
          state.authOpen = false;
          if (r === "kitchen") state.staffTab = "kds";
          else if (r === "cashier") state.staffTab = "pos";
          else if (r === "courier") state.staffTab = "courier";
          else state.staffTab = "analytics";
          persistLocal();
          notify(`Активна роль: ${ROLE_META[r].label}`);
        };
      });

      const staffAuthForm = document.getElementById("staff-auth-form");
      if (staffAuthForm) {
        staffAuthForm.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById("sauth-name").value.trim();
          const email = document.getElementById("sauth-email").value.trim();
          const pass = document.getElementById("sauth-pass").value;
          const role = state.authRole;
          const newMember = { id: crypto.randomUUID ? crypto.randomUUID() : `u-${Date.now()}`, name, email, role, shift: true };

          const sb = getSbClient();
          if (sb) {
            try {
              const { data } = await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name, role } } });
              if (data?.user?.id) newMember.id = data.user.id;
              await sb.from("vostok_profiles").upsert({ id: newMember.id, email, full_name: name, role, is_on_shift: true });
            } catch (_) {}
          }

          state.staff = [newMember, ...state.staff.filter((x) => x.email !== email)];
          state.user = newMember;
          state.authOpen = false;
          persistLocal();
          notify(`Сотрудник ${name} (${ROLE_META[role].label}) зарегистрирован!`);
        };
      }

      // KDS: отметка готовности отдельных блюд и смена статуса заказа
      document.querySelectorAll(".itemchk-btn").forEach((b) => {
        b.onclick = async () => {
          const [ordId, idxStr] = b.dataset.itemchk.split(":");
          const ord = state.orders.find((o) => o.id === ordId);
          if (ord && ord.items && ord.items[Number(idxStr)]) {
            ord.items[Number(idxStr)].ready = !ord.items[Number(idxStr)].ready;
            persistLocal();
            const sb = getSbClient();
            if (sb) { try { await sb.from("orders").update({ items: ord.items }).eq("id", ord.id); } catch (_) {} }
            render();
          }
        };
      });

      document.querySelectorAll(".ost-btn").forEach((b) => {
        b.onclick = async () => {
          const [id, st] = b.dataset.ost.split(":");
          const ord = state.orders.find((o) => o.id === id);
          if (ord) {
            ord.status = st;
            persistLocal();
            const sb = getSbClient();
            if (sb) { try { await sb.from("orders").update({ status: st }).eq("id", id); } catch (_) {} }
            notify(`Заказ #${ord.number}: ${STATUS_META[st]?.label}`);
          }

      const posAddr = document.getElementById("pos-addr");
      if (posAddr) posAddr.oninput = (e) => { state.posAddress = e.target.value; };
      document.querySelectorAll(".postype-btn").forEach((b) => {
        b.onclick = () => { state.posType = b.dataset.postype; render(); };
      });
      document.querySelectorAll(".posadd-btn").forEach((b) => {
        b.onclick = () => {
          const p = state.products.find((x) => x.id === b.dataset.posadd);
          if (!p) return;
          const ex = state.posCart.find((c) => c.id === p.id);
          if (ex) ex.qty += 1;
          else state.posCart.push({ id: p.id, name: p.name, price: p.base_price, qty: 1 });
          render();
        };
      });
      document.querySelectorAll(".posrem-btn").forEach((b) => {
        b.onclick = () => {
          state.posCart.splice(Number(b.dataset.posrem), 1);
          render();
        };
      });
      const posSend = document.getElementById("pos-send-btn");
      if (posSend) {
        posSend.onclick = async () => {
          if (!state.posCart.length) return;
          const num = state.orders.length ? Math.max(...state.orders.map((o) => Number(o.number) || 100), 103) + 1 : 104;
          const total = state.posCart.reduce((s, c) => s + c.price * c.qty, 0);
          const posOrd = {
            id: `ord-${Date.now()}`,
            number: num,
            customer: state.posCustomer || "Гость в зале",
            phone: "Касса POS",
            type: state.posType,
            address: state.posType === "delivery" ? (state.posAddress || "Доставка") : "В зале (свободная посадка)",
            comment: "Оформлено через Кассу POS",
            paymentMethod: "cash",
            paymentStatus: "paid",
            transactionId: "POS-" + num,
            status: "new",
            total,
            createdAt: Date.now(),
            items: state.posCart.map((c) => ({ name: c.name, size: "Стандарт", base: "Тандырная лепёшка", addons: [], qty: c.qty, price: c.price, ready: false }))
          };
          state.orders.unshift(posOrd);
          state.posCart = [];
          state.staffTab = "kds";
          persistLocal();

          const sb = getSbClient();
          if (sb) {
            try {
              await sb.from("orders").insert({
                id: posOrd.id,
                order_number: posOrd.number,
                customer_name: posOrd.customer,
                customer_phone: posOrd.phone,
                delivery_type: posOrd.type,
                address: posOrd.address,
                comment: posOrd.comment,
                payment_method: "cash",
                payment_status: "paid",
                status: "new",
                total_amount: posOrd.total,
                items: posOrd.items
              });
            } catch (_) {}
          }
          notify(`Заказ #${num} на сумму ${fmt(total)} отправлен на кухню`);
        };
      }

      // Добавление нового блюда + загрузка фото в Supabase Storage
      const photoInput = document.getElementById("nd-photo-file");
      if (photoInput) {
        photoInput.onchange = async (e) => {
          const file = e.target.files?.[0];
          if (!file) return;
          state.newDishName = document.getElementById("nd-name")?.value || state.newDishName;
          state.newDishCat = document.getElementById("nd-cat")?.value || state.newDishCat;
          state.newDishPrice = document.getElementById("nd-price")?.value || state.newDishPrice;
          state.newDishDesc = document.getElementById("nd-desc")?.value || state.newDishDesc;
          state.newDishWeight = document.getElementById("nd-weight")?.value || state.newDishWeight;
          state.newDishCalories = document.getElementById("nd-cal")?.value || state.newDishCalories;
          state.newDishImageFile = file;
          state.newDishImagePreview = await fileToDataUrl(file);
          render();
        };
      }

      const addDishForm = document.getElementById("add-dish-form");
      if (addDishForm) {
        addDishForm.onsubmit = async (e) => {
          e.preventDefault();
          const name = document.getElementById("nd-name").value.trim();
          const category_slug = document.getElementById("nd-cat").value;
          const base_price = Math.max(100, Number(document.getElementById("nd-price").value) || 2500);
          const description = document.getElementById("nd-desc").value.trim() || "Фирменное блюдо восточной кухни из свежих продуктов";
          const weight = Math.max(50, Number(document.getElementById("nd-weight").value) || 350);
          const calories = Math.max(20, Number(document.getElementById("nd-cal").value) || 550);
          const is_hit = document.getElementById("nd-hit").checked;
          const is_spicy = document.getElementById("nd-spicy").checked;
          const is_veg = document.getElementById("nd-veg").checked;

          state.newDishUploading = true;
          render();

          let imageUrl = state.newDishImagePreview || IMAGES.plov || "https://images.unsplash.com/photo-1633945274405-b6c8069047b0?w=600";
          let storageUsed = false;

          if (state.newDishImageFile) {
            const upRes = await uploadImageToSupabaseStorage(state.newDishImageFile);
            imageUrl = upRes.url;
            storageUsed = upRes.storageUsed;
          }

          const newProd = {
            id: `p-${Date.now()}`,
            category_slug,
            name,
            description,
            base_price,
            weight,
            calories,
            image: imageUrl,
            is_available: true,
            is_hit,
            is_spicy,
            is_veg,
            sizes: [
              { label: "Стандарт", mult: 1, g: weight },
              { label: "Большая", mult: 1.35, g: Math.round(weight * 1.35) }
            ]
          };

          state.products.unshift(newProd);
          state.newDishName = "";
          state.newDishDesc = "";
          state.newDishImageFile = null;
          state.newDishImagePreview = "";
          state.newDishUploading = false;
          persistLocal();

          const sb = getSbClient();
          if (sb) {
            try {
              await sb.from("products").insert({
                id: newProd.id,
                category_slug: newProd.category_slug,
                name: newProd.name,
                description: newProd.description,
                base_price: newProd.base_price,
                weight_grams: newProd.weight,
                calories: newProd.calories,
                image_url: newProd.image,
                is_available: true,
                is_hit: newProd.is_hit,
                is_spicy: newProd.is_spicy,
                is_veg: newProd.is_veg,
                sizes: newProd.sizes
              });
            } catch (err) {
              console.warn("Supabase product insert fallback:", err);
            }

          notify(`Блюдо «${name}» (${fmt(base_price)}) добавлено${storageUsed ? " (фото в Supabase Storage)" : ""}!`);
        };

      // Редактирование цен и стоп-лист
      document.querySelectorAll(".price-inp").forEach((inp) => {

            const sb = getSbClient();
            if (sb) { try { await sb.from("inventory").update({ quantity: item.qty }).eq("id", id); } catch (_) {} }

          }

            notify("Выполните supabase/schema.sql в SQL Editor");
          }
        };
      }

    // ==================== ИИ АССИСТЕНТ ПЕРСОНАЛА ====================
    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatAiText(text) {
      return escapeHtml(text)
        .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
        .replace(/\*(.+?)\*/g, "<i>$1</i>")
        .replace(/`([^`]+)`/g, '<code class="px-1.5 py-0.5 rounded bg-orange-100 text-orange-900 font-mono text-xs font-bold">$1</code>')
        .replace(/\n/g, "<br>");
    }

    function appendAiMessage(role, htmlContent) {
      const box = document.getElementById("aiMessages");
      const div = document.createElement("div");
      div.className = `ai-msg ${role === "user" ? "ai-msg-user" : "ai-msg-bot"}`;
      div.innerHTML = htmlContent;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    function buildStaffAiContext() {
      const revenue = state.orders.filter((o) => o.status !== "cancelled").reduce((s, o) => s + Number(o.total || 0), 0);
      const kds = state.orders.filter((o) => ["new", "cooking", "ready"].includes(o.status));
      const invSummary = state.inventory.map((i) => `- ${i.name}: ${i.qty} ${i.unit} (мин. порог: ${i.min} ${i.unit})`).join("\n");
      const ordSummary = state.orders.slice(0, 10).map((o) => `- Заказ #${o.number} (${o.customer}): ${STATUS_META[o.status]?.label}, ${o.total} ₸`).join("\n");

      return `Ты "Восток AI • Аналитик" — операционный ИИ-помощник персонала и управляющего ресторана восточной кухни "ВОСТОК ХАУС".
Все суммы указывай в казахстанских тенге (₸).
ВЫРУЧКА СМЕНЫ: ${revenue} ₸ (всего заказов: ${state.orders.length}, активных на кухне KDS: ${kds.length})
ПОСЛЕДНИЕ ЗАКАЗЫ В БАЗЕ:
${ordSummary}
СКЛАД ПРОДУКТОВ В БАЗЕ:
${invSummary}
БЛЮД В МЕНЮ: ${state.products.length} (на стопе: ${state.products.filter((p) => !p.is_available).length})`;
    }

    async function askStaffAI(userText) {
      const cleanText = (userText || "").trim();
      if (!cleanText) return;

      appendAiMessage("user", escapeHtml(cleanText));
      aiHistory.push({ role: "user", parts: [{ text: cleanText }] });

      const typingEl = appendAiMessage("bot", '<div class="ai-dots"><span></span><span></span><span></span></div>');
      const sendBtn = document.getElementById("aiSendBtn");
      const input = document.getElementById("aiInput");
      sendBtn.disabled = true;
      input.disabled = true;

      try {
        const result = await window.callVostokAi({
          sbUrl: state.sbUrl,
          sbKey: state.sbKey,
          aiFn: state.aiFn,
          systemPrompt: buildStaffAiContext(),
          history: aiHistory,
          userText: cleanText,
          dbSnapshot: {
            isStaff: true,
            products: state.products,
            orders: state.orders,
            inventory: state.inventory
          }
        });

        aiHistory.push({ role: "model", parts: [{ text: result.reply }] });
        typingEl.innerHTML = formatAiText(result.reply);
      } catch (err) {
        aiHistory.pop();
        typingEl.innerHTML = `<span class="text-rose-600 font-bold">Ошибка:</span><br>${escapeHtml(err.message || String(err))}`;
      } finally {
        const box = document.getElementById("aiMessages");
        box.scrollTop = box.scrollHeight;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    function setupStaffAiWidget() {
      const fab = document.getElementById("aiFab");
      const panel = document.getElementById("aiPanel");
      const closeBtn = document.getElementById("aiClose");
      const clearBtn = document.getElementById("aiClear");
      const form = document.getElementById("aiForm");
      const input = document.getElementById("aiInput");

      fab.onclick = () => {
        panel.classList.toggle("hidden");
        if (!panel.classList.contains("hidden")) input.focus();
      };
      closeBtn.onclick = () => panel.classList.add("hidden");
      clearBtn.onclick = () => {
        aiHistory = [];
        document.getElementById("aiMessages").innerHTML = `<div class="ai-msg ai-msg-bot">Чат аналитика очищен. Задайте вопрос по выручке, складу или очереди заказов!</div>`;
      };
      form.onsubmit = async (e) => {
        e.preventDefault();
        const text = input.value;
        input.value = "";
        await askStaffAI(text);
      };
      document.querySelectorAll(".ai-quick").forEach((btn) => {
        btn.addEventListener("click", () => {
          const prompt = btn.getAttribute("data-prompt");
          if (prompt && !document.getElementById("aiSendBtn").disabled) askStaffAI(prompt);
        });
      });
    }

    render();
    setupStaffAiWidget();
    syncFromSupabase();
  </script>
</body>
</html>
